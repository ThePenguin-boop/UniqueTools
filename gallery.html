<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 

<title>Image Gallery</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #151515;
    color: #eee;
}

header {
    text-align: center;
    padding: 50px 20px 30px;
}

header h1 {
    margin: 0;
    font-size: 42px;
    font-weight: 750;
}

header p {
    margin: 10px 0 0;
    color: #999;
    font-size: 16px;
}

.controls {
    width: min(1100px, calc(100% - 30px));
    margin: 0 auto 25px;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.status {
    color: #888;
    font-size: 14px;
}

.refresh-button {
    border: 1px solid #444;
    border-radius: 8px;
    padding: 9px 14px;

    background: #222;
    color: #eee;

    font-family: inherit;
    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background 0.15s,
        border-color 0.15s;
}

.refresh-button:hover {
    background: #292929;
    border-color: #666;
}

.gallery {
    width: min(1100px, calc(100% - 30px));
    margin: 0 auto 50px;

    display: grid;
    grid-template-columns: repeat(
        auto-fill,
        minmax(250px, 1fr)
    );

    gap: 20px;
}

.image-card {
    overflow: hidden;

    background: #222;
    border: 1px solid #333;
    border-radius: 16px;

    transition:
        transform 0.15s,
        background 0.15s,
        border-color 0.15s;
}

.image-card:hover {
    transform: translateY(-4px);
    background: #292929;
    border-color: #555;
}

.image-preview {
    width: 100%;
    height: 220px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 15px;

    background-color: #888;

    background-image:
        linear-gradient(45deg, #aaa 25%, transparent 25%),
        linear-gradient(-45deg, #aaa 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #aaa 75%),
        linear-gradient(-45deg, transparent 75%, #aaa 75%);

    background-size: 30px 30px;

    background-position:
        0 0,
        0 15px,
        15px -15px,
        -15px 0;
}

.image-preview img {
    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    display: block;
}

.image-info {
    padding: 16px;
}

.image-name {
    margin: 0 0 5px;

    font-size: 16px;
    font-weight: 650;

    word-break: break-word;
}

.image-type {
    margin: 0 0 14px;

    color: #888;
    font-size: 13px;
}

.download-button {
    display: block;

    width: 100%;

    padding: 10px;

    border-radius: 8px;

    background: #eee;
    color: #111;

    text-align: center;
    text-decoration: none;

    font-size: 14px;
    font-weight: 650;

    transition: background 0.15s;
}

.download-button:hover {
    background: #fff;
}

.message {
    grid-column: 1 / -1;

    padding: 50px 20px;

    border-radius: 16px;

    background: #222;
    border: 1px solid #333;

    text-align: center;

    color: #888;
}

.message strong {
    display: block;

    margin-bottom: 8px;

    color: #eee;
    font-size: 18px;
}

.back-button {
    display: block;

    width: fit-content;

    margin: 0 auto 50px;

    padding: 10px 15px;

    border-radius: 8px;

    background: #222;
    border: 1px solid #333;

    color: #eee;
    text-decoration: none;

    font-weight: 600;

    transition:
        background 0.15s,
        border-color 0.15s;
}

.back-button:hover {
    background: #292929;
    border-color: #555;
}

footer {
    text-align: center;

    color: #666;

    font-size: 13px;

    padding-bottom: 30px;
}

@media (max-width: 600px) {

    header h1 {
        font-size: 34px;
    }

    .controls {
        align-items: stretch;
        flex-direction: column;
    }

    .refresh-button {
        width: 100%;
    }

    .gallery {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>

    <h1>📷 Image Gallery</h1>

    <p>
        Images from the UniqueTools images folder
    </p>

</header>


<div class="controls">

    <div
        class="status"
        id="status"
    >
        Loading images...
    </div>

    <button
        class="refresh-button"
        id="refreshButton"
        type="button"
    >
        ↻ Refresh
    </button>

</div>


<main
    class="gallery"
    id="gallery"
></main>


<a
    href="index.html"
    class="back-button"
>
    ← Back to My Tools
</a>


<footer>
    My personal image gallery
</footer>


<script>

/*
============================================================
AUTOMATIC GITHUB IMAGE GALLERY
============================================================

Repository:
https://github.com/ThePenguin-boop/UniqueTools

The gallery automatically checks:

    UniqueTools/images/

You do not need to manually enter image filenames.

Supported:
    PNG
    JPG
    JPEG
    GIF
    WEBP
    SVG
    BMP
    AVIF

Just upload an image to the images folder,
commit it to GitHub, then refresh this page.

============================================================
*/


/* ==========================================================
   GITHUB SETTINGS
   ========================================================== */

const GITHUB_OWNER =
    "ThePenguin-boop";

const GITHUB_REPOSITORY =
    "UniqueTools";

const IMAGE_FOLDER =
    "images";


/* ==========================================================
   SUPPORTED FILE TYPES
   ========================================================== */

const supportedExtensions = [

    ".png",
    ".jpg",
    ".jpeg",
    ".gif",
    ".webp",
    ".svg",
    ".bmp",
    ".avif"

];


/* ==========================================================
   PAGE ELEMENTS
   ========================================================== */

const gallery =
    document.getElementById("gallery");

const status =
    document.getElementById("status");

const refreshButton =
    document.getElementById("refreshButton");


/* ==========================================================
   LOAD IMAGES
   ========================================================== */

async function loadImages() {

    gallery.innerHTML = "";

    status.textContent =
        "Loading images...";


    try {

        /*
         * Ask GitHub for everything inside
         * the images folder.
         */

        const apiURL =
            "https://api.github.com/repos/" +
            encodeURIComponent(GITHUB_OWNER) +
            "/" +
            encodeURIComponent(GITHUB_REPOSITORY) +
            "/contents/" +
            IMAGE_FOLDER;


        const response =
            await fetch(
                apiURL,
                {
                    headers: {
                        "Accept":
                            "application/vnd.github+json",

                        "X-GitHub-Api-Version":
                            "2022-11-28"
                    },

                    cache: "no-store"
                }
            );


        /*
         * GitHub returned an error.
         */

        if (!response.ok) {

            let errorMessage =
                "GitHub returned HTTP " +
                response.status;

            try {

                const errorData =
                    await response.json();

                if (errorData.message) {

                    errorMessage =
                        errorData.message;

                }

            }
            catch {

                // Keep the original error message.

            }

            throw new Error(errorMessage);

        }


        const files =
            await response.json();


        /*
         * Make sure the response is a folder listing.
         */

        if (!Array.isArray(files)) {

            throw new Error(
                "The images folder could not be read."
            );

        }


        /*
         * Only keep actual image files.
         */

        const imageFiles =
            files.filter(file => {

                if (file.type !== "file") {

                    return false;

                }

                const filename =
                    file.name.toLowerCase();


                return supportedExtensions.some(
                    extension =>
                        filename.endsWith(extension)
                );

            });


        /*
         * Sort alphabetically.
         */

        imageFiles.sort(
            (a, b) =>
                a.name.localeCompare(
                    b.name,
                    undefined,
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                )
        );


        /*
         * No images.
         */

        if (imageFiles.length === 0) {

            status.textContent =
                "No images found.";

            gallery.innerHTML = `

                <div class="message">

                    <strong>
                        No images found
                    </strong>

                    Put image files inside the
                    <b>images</b> folder and
                    refresh the page.

                </div>

            `;

            return;

        }


        /*
         * Create a card for every image.
         */

        imageFiles.forEach(file => {

            createImageCard(file);

        });


        /*
         * Update count.
         */

        status.textContent =
            imageFiles.length +
            (
                imageFiles.length === 1
                    ? " image"
                    : " images"
            ) +
            " found";


    }
    catch (error) {

        console.error(
            "Gallery error:",
            error
        );


        status.textContent =
            "Could not load images";


        gallery.innerHTML = `

            <div class="message">

                <strong>
                    ⚠️ Could not load the gallery
                </strong>

                ${escapeHTML(error.message)}

                <br><br>

                Make sure the repository and
                <b>images</b> folder exist.

            </div>

        `;

    }

}


/* ==========================================================
   CREATE IMAGE CARD
   ========================================================== */

function createImageCard(file) {

    const card =
        document.createElement("article");


    card.className =
        "image-card";


    /*
     * GitHub's raw download URL.
     */

    const rawURL =
        file.download_url;


    /*
     * URL through GitHub Pages.
     *
     * This is same-origin with the gallery,
     * which makes the download attribute
     * more reliable.
     */

    const pagesURL =
        new URL(
            IMAGE_FOLDER +
            "/" +
            encodeURIComponent(file.name),

            window.location.href
        ).href;


    /*
     * File extension.
     */

    const extension =
        file.name
            .split(".")
            .pop()
            .toUpperCase();


    /*
     * Image area.
     */

    const preview =
        document.createElement("div");

    preview.className =
        "image-preview";


    const image =
        document.createElement("img");

    image.src =
        rawURL;

    image.alt =
        file.name;

    image.loading =
        "lazy";


    /*
     * If GitHub Pages has the image available,
     * use it. Otherwise keep the raw GitHub URL.
     */

    image.addEventListener(
        "error",
        () => {

            if (image.src !== rawURL) {

                image.src =
                    rawURL;

            }

        }
    );


    preview.appendChild(image);


    /*
     * Information area.
     */

    const info =
        document.createElement("div");

    info.className =
        "image-info";


    const name =
        document.createElement("p");

    name.className =
        "image-name";

    name.textContent =
        file.name;


    const type =
        document.createElement("p");

    type.className =
        "image-type";

    type.textContent =
        extension;


    /*
     * Download button.
     */

    const download =
        document.createElement("a");

    download.className =
        "download-button";

    download.textContent =
        "Download";

    download.href =
        pagesURL;

    download.download =
        file.name;


    /*
     * Open the raw GitHub version if the
     * GitHub Pages version isn't available.
     */

    download.addEventListener(
        "click",
        () => {

            setTimeout(() => {

                /*
                 * The normal Pages URL is used first.
                 * The browser decides whether to download
                 * it or display it.
                 */

            }, 0);

        }
    );


    info.appendChild(name);
    info.appendChild(type);
    info.appendChild(download);


    card.appendChild(preview);
    card.appendChild(info);


    gallery.appendChild(card);

}


/* ==========================================================
   ESCAPE HTML
   ========================================================== */

function escapeHTML(text) {

    return String(text)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ==========================================================
   REFRESH BUTTON
   ========================================================== */

refreshButton.addEventListener(
    "click",
    loadImages
);


/* ==========================================================
   START GALLERY
   ========================================================== */

loadImages();

</script>

</body>
</html>
