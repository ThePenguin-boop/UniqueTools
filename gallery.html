<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Image Gallery</title>


<style>

/* ================================
   GENERAL
================================ */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #202020 0%,
            #111 45%,
            #090909 100%
        );

    color: #f5f5f5;
}


.container {

    width: min(1200px, 92%);

    margin: 0 auto;

    padding:
        55px 0
        70px;
}


/* ================================
   HEADER
================================ */

header {

    text-align: center;

    margin-bottom: 35px;
}


header h1 {

    margin: 0 0 10px;

    font-size:
        clamp(
            2rem,
            5vw,
            3rem
        );

    font-weight: 700;

    letter-spacing: -1px;
}


header p {

    margin: 0;

    color: #a9a9a9;

    font-size: 1rem;
}


/* ================================
   MAIN PANEL
================================ */

.panel {

    background:
        rgba(
            25,
            25,
            25,
            0.92
        );

    border:
        1px solid #333;

    border-radius: 18px;

    padding: 25px;

    box-shadow:

        0 15px 45px
        rgba(
            0,
            0,
            0,
            0.35
        ),

        inset 0 1px 0
        rgba(
            255,
            255,
            255,
            0.03
        );
}


/* ================================
   TOOLBAR
================================ */

.toolbar {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 22px;
}


.gallery-title {

    margin: 0;

    font-size: 1.15rem;
}


.gallery-count {

    color: #888;

    font-size: 0.9rem;

    margin-left: 6px;
}


/* ================================
   GALLERY
================================ */

.gallery {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(240px, 1fr)
        );

    gap: 20px;
}


/* ================================
   CARD
================================ */

.card {

    overflow: hidden;

    background: #191919;

    border:
        1px solid #333;

    border-radius: 15px;

    box-shadow:
        0 10px 25px
        rgba(
            0,
            0,
            0,
            0.22
        );

    transition:
        transform 0.2s ease,
        border-color 0.2s ease;
}


.card:hover {

    transform:
        translateY(-3px);

    border-color:
        #4a4a4a;
}


/* ================================
   IMAGE PREVIEW
================================ */

.preview {

    position: relative;

    height: 210px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 12px;

    background:

        linear-gradient(
            45deg,
            #1c1c1c 25%,
            transparent 25%
        ),

        linear-gradient(
            -45deg,
            #1c1c1c 25%,
            transparent 25%
        ),

        linear-gradient(
            45deg,
            transparent 75%,
            #1c1c1c 75%
        ),

        linear-gradient(
            -45deg,
            transparent 75%,
            #1c1c1c 75%
        );

    background-size:
        24px 24px;

    background-position:
        0 0,
        0 12px,
        12px -12px,
        -12px 0;
}


.preview img {

    max-width: 100%;

    max-height: 100%;

    object-fit: contain;

    display: block;
}


/* ================================
   FILE TYPE BADGE
================================ */

.file-type {

    position: absolute;

    top: 10px;
    left: 10px;

    padding:
        5px 8px;

    border-radius: 7px;

    background:
        rgba(
            0,
            0,
            0,
            0.75
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.12
        );

    font-size: 0.72rem;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 0.5px;

    z-index: 2;
}


/* ================================
   CARD INFORMATION
================================ */

.card-info {

    padding: 15px;
}


.file-name {

    font-size: 0.95rem;

    font-weight: 600;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    margin-bottom: 6px;
}


.file-details {

    color: #777;

    font-size: 0.78rem;

    margin-bottom: 14px;
}


/* ================================
   DOWNLOAD BUTTON
================================ */

.download {

    display: block;

    width: 100%;

    padding: 10px;

    text-align: center;

    text-decoration: none;

    color: #fff;

    background: #252525;

    border:
        1px solid #444;

    border-radius: 9px;

    font-size: 0.85rem;

    transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
}


.download:hover {

    background: #333;

    border-color: #666;

    transform:
        translateY(-1px);
}


/* ================================
   INFORMATION BOX
================================ */

.info {

    margin-top: 25px;

    padding:
        14px 16px;

    border-radius: 10px;

    border:
        1px solid #2d2d2d;

    background:
        rgba(
            255,
            255,
            255,
            0.025
        );

    color: #777;

    font-size: 0.8rem;

    line-height: 1.5;
}


/* ================================
   MOBILE
================================ */

@media (max-width: 600px) {

    .container {

        width: 94%;

        padding-top: 30px;
    }


    .panel {

        padding: 16px;
    }


    .gallery {

        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<div class="container">


<header>

    <h1>
        Image Gallery
    </h1>

    <p>
        Browse and download the available images.
    </p>

</header>


<div class="panel">


<div class="toolbar">

    <h2 class="gallery-title">

        Gallery

        <span
            class="gallery-count"
            id="galleryCount"
        >
            0 files
        </span>

    </h2>

</div>


<div
    class="gallery"
    id="gallery"
></div>


<div class="info">

    Images are stored in the
    <strong>images</strong> folder.
    Add a filename to the list in the code
    to make it appear in the gallery.

</div>


</div>


</div>



<script>


/* ==================================================
   
   ⭐ ADD YOUR FILES HERE ⭐

   Put the actual files inside the "images"
   folder, then add their filenames below.

   That's all you need to do.

================================================== */


const images = [

    "solvers.svg",

    "Ashton1978 Base MD Vectors.svg",

    // Add more files below:

    // "my-image.svg",
    // "another-image.png",
    // "cool-picture.jpg",
    // "logo.webp",

];



/* ==================================================
   SETTINGS
================================================== */

const imageFolder = "images/";



/* ==================================================
   CREATE GALLERY
================================================== */

const gallery =
    document.getElementById("gallery");


const galleryCount =
    document.getElementById("galleryCount");


galleryCount.textContent =
    images.length === 1
        ? "1 file"
        : `${images.length} files`;



/* ==================================================
   CREATE EACH CARD
================================================== */

images.forEach(filename => {

    createCard(filename);

});



function createCard(filename) {

    const extension =
        getExtension(filename);


    const fileType =
        getFileType(extension);


    const fileURL =
        imageFolder +
        encodeURIComponent(filename);


    const card =
        document.createElement("div");


    card.className =
        "card";


    card.innerHTML = `

        <div class="preview">

            <span class="file-type">
                ${fileType}
            </span>

            <img
                src="${fileURL}"
                alt="${escapeHTML(filename)}"
                loading="lazy"
            >

        </div>


        <div class="card-info">

            <div
                class="file-name"
                title="${escapeHTML(filename)}"
            >
                ${escapeHTML(filename)}
            </div>


            <div class="file-details">

                ${fileType}

                ·

                ${extension.toUpperCase()}

            </div>


            <a
                class="download"
                href="${fileURL}"
                download="${escapeHTML(filename)}"
            >
                Download
            </a>

        </div>

    `;


    gallery.appendChild(card);

}



/* ==================================================
   GET FILE EXTENSION
================================================== */

function getExtension(filename) {

    const parts =
        filename.split(".");


    if (parts.length < 2) {

        return "file";

    }


    return parts
        .pop()
        .toLowerCase();

}



/* ==================================================
   FRIENDLY FILE TYPE
================================================== */

function getFileType(extension) {

    const types = {

        svg: "SVG",

        png: "PNG",

        jpg: "JPG",

        jpeg: "JPEG",

        gif: "GIF",

        webp: "WEBP",

        avif: "AVIF",

        bmp: "BMP",

        ico: "ICO",

        tif: "TIFF",

        tiff: "TIFF"

    };


    return (
        types[extension] ||
        extension.toUpperCase()
    );

}



/* ==================================================
   SECURITY
================================================== */

function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

</script>


</body>

</html>
