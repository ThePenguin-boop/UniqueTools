<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Gallery</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #151515;
    color: #eee;
}

header {
    text-align: center;
    padding: 50px 20px 30px;
}

header h1 {
    margin: 0;
    font-size: 42px;
    font-weight: 750;
}

header p {
    margin: 10px 0 0;
    color: #999;
    font-size: 16px;
}

.controls {
    width: min(1100px, calc(100% - 30px));
    margin: 0 auto 25px;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.status {
    color: #888;
    font-size: 14px;
}

.refresh-button {
    border: 1px solid #444;
    border-radius: 8px;
    padding: 9px 14px;

    background: #222;
    color: #eee;

    font-family: inherit;
    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background 0.15s,
        border-color 0.15s;
}

.refresh-button:hover {
    background: #292929;
    border-color: #666;
}

.gallery {
    width: min(1100px, calc(100% - 30px));
    margin: 0 auto 50px;

    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(250px, 1fr));

    gap: 20px;
}

.image-card {
    overflow: hidden;

    background: #222;
    border: 1px solid #333;
    border-radius: 16px;

    transition:
        transform 0.15s,
        background 0.15s,
        border-color 0.15s;
}

.image-card:hover {
    transform: translateY(-4px);
    background: #292929;
    border-color: #555;
}

.image-preview {
    width: 100%;
    height: 220px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 15px;

    background-color: #888;

    background-image:
        linear-gradient(45deg, #aaa 25%, transparent 25%),
        linear-gradient(-45deg, #aaa 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #aaa 75%),
        linear-gradient(-45deg, transparent 75%, #aaa 75%);

    background-size: 30px 30px;

    background-position:
        0 0,
        0 15px,
        15px -15px,
        -15px 0;
}

.image-preview img {
    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    display: block;
}

.image-info {
    padding: 16px;
}

.image-name {
    margin: 0 0 5px;

    font-size: 16px;
    font-weight: 650;

    word-break: break-word;
}

.image-type {
    margin: 0 0 14px;

    color: #888;
    font-size: 13px;
}

.download-button {
    display: block;

    width: 100%;

    padding: 10px;

    border-radius: 8px;

    background: #eee;
    color: #111;

    text-align: center;
    text-decoration: none;

    font-size: 14px;
    font-weight: 650;

    transition: background 0.15s;
}

.download-button:hover {
    background: #fff;
}

.message {
    grid-column: 1 / -1;

    padding: 50px 20px;

    border-radius: 16px;

    background: #222;
    border: 1px solid #333;

    text-align: center;

    color: #888;
}

.message strong {
    display: block;

    margin-bottom: 8px;

    color: #eee;
    font-size: 18px;
}

.message small {
    color: #666;
}

.back-button {
    display: block;

    width: fit-content;

    margin: 0 auto 50px;

    padding: 10px 15px;

    border-radius: 8px;

    background: #222;
    border: 1px solid #333;

    color: #eee;
    text-decoration: none;

    font-weight: 600;

    transition:
        background 0.15s,
        border-color 0.15s;
}

.back-button:hover {
    background: #292929;
    border-color: #555;
}

footer {
    text-align: center;

    color: #666;

    font-size: 13px;

    padding-bottom: 30px;
}

@media (max-width: 600px) {

    header h1 {
        font-size: 34px;
    }

    .controls {
        align-items: stretch;
        flex-direction: column;
    }

    .refresh-button {
        width: 100%;
    }

    .gallery {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>

    <h1>📷 Image Gallery</h1>

    <p>
        Images from the UniqueTools images folder
    </p>

</header>


<div class="controls">

    <div
        class="status"
        id="status"
    >
        Loading images...
    </div>

    <button
        class="refresh-button"
        id="refreshButton"
        type="button"
    >
        ↻ Refresh
    </button>

</div>


<main
    class="gallery"
    id="gallery"
></main>


<a
    href="index.html"
    class="back-button"
>
    ← Back to My Tools
</a>


<footer>
    My personal image gallery
</footer>


<script>

/*
============================================================
AUTOMATIC GITHUB GALLERY
============================================================

Repository:
ThePenguin-boop/UniqueTools

Folder:
images/

The gallery asks GitHub for the files inside the folder.

You can add or remove images without editing this HTML.

============================================================
*/


const OWNER =
    "ThePenguin-boop";

const REPOSITORY =
    "UniqueTools";

const BRANCH =
    "main";

const FOLDER =
    "images";


const API_URL =
    "https://api.github.com/repos/" +
    OWNER +
    "/" +
    REPOSITORY +
    "/contents/" +
    FOLDER +
    "?ref=" +
    BRANCH;


const RAW_BASE =
    "https://raw.githubusercontent.com/" +
    OWNER +
    "/" +
    REPOSITORY +
    "/" +
    BRANCH +
    "/" +
    FOLDER +
    "/";


const gallery =
    document.getElementById("gallery");

const status =
    document.getElementById("status");

const refreshButton =
    document.getElementById("refreshButton");


const supportedExtensions = [
    ".png",
    ".jpg",
    ".jpeg",
    ".gif",
    ".webp",
    ".svg",
    ".bmp",
    ".avif"
];


/*
============================================================
LOAD GALLERY
============================================================
*/

async function loadGallery() {

    gallery.innerHTML = "";

    status.textContent =
        "Checking GitHub for images...";


    try {

        /*
         * Add a timestamp so the browser doesn't
         * reuse an old API response.
         */

        const url =
            API_URL +
            "&cacheBust=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    cache: "no-store",

                    headers: {
                        "Accept":
                            "application/vnd.github+json"
                    }
                }
            );


        if (!response.ok) {

            let message =
                "GitHub API error: " +
                response.status;


            try {

                const data =
                    await response.json();

                if (data.message) {

                    message =
                        data.message;

                }

            }
            catch {

                // Keep default message.

            }


            throw new Error(message);

        }


        const files =
            await response.json();


        if (!Array.isArray(files)) {

            throw new Error(
                "GitHub did not return a folder."
            );

        }


        /*
         * Only use actual image files.
         */

        const images =
            files.filter(file => {

                if (file.type !== "file") {

                    return false;

                }


                const name =
                    file.name.toLowerCase();


                return supportedExtensions.some(
                    extension =>
                        name.endsWith(extension)
                );

            });


        /*
         * Alphabetical order.
         */

        images.sort(
            (a, b) =>
                a.name.localeCompare(
                    b.name,
                    undefined,
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                )
        );


        /*
         * No images.
         */

        if (images.length === 0) {

            status.textContent =
                "No images found.";

            gallery.innerHTML = `

                <div class="message">

                    <strong>
                        📭 No images found
                    </strong>

                    Upload images into:

                    <br><br>

                    <b>UniqueTools / images</b>

                </div>

            `;

            return;

        }


        /*
         * Create cards.
         */

        images.forEach(
            createImageCard
        );


        status.textContent =
            images.length +
            (
                images.length === 1
                    ? " image"
                    : " images"
            ) +
            " found in images/";


    }
    catch (error) {

        console.error(
            "Gallery error:",
            error
        );


        status.textContent =
            "Gallery error";


        gallery.innerHTML = `

            <div class="message">

                <strong>
                    ⚠️ Could not load images
                </strong>

                ${escapeHTML(error.message)}

                <br><br>

                <small>
                    Make sure the repository is public
                    and the images folder exists.
                </small>

            </div>

        `;

    }

}


/*
============================================================
CREATE CARD
============================================================
*/

function createImageCard(file) {

    const card =
        document.createElement("article");

    card.className =
        "image-card";


    /*
     * Use raw.githubusercontent.com directly.
     *
     * This avoids waiting for GitHub Pages
     * to deploy the image.
     */

    const rawURL =
        RAW_BASE +
        encodeURIComponent(file.name);


    /*
     * Preview.
     */

    const preview =
        document.createElement("div");

    preview.className =
        "image-preview";


    const image =
        document.createElement("img");

    image.src =
        rawURL;

    image.alt =
        file.name;

    image.loading =
        "lazy";


    /*
     * If an image somehow fails,
     * show a broken-image message instead
     * of crashing the gallery.
     */

    image.addEventListener(
        "error",
        () => {

            image.alt =
                "Unable to load " +
                file.name;

        }
    );


    preview.appendChild(image);


    /*
     * Information.
     */

    const info =
        document.createElement("div");

    info.className =
        "image-info";


    const name =
        document.createElement("p");

    name.className =
        "image-name";

    name.textContent =
        file.name;


    const extension =
        file.name
            .split(".")
            .pop()
            .toUpperCase();


    const type =
        document.createElement("p");

    type.className =
        "image-type";

    type.textContent =
        extension;


    /*
     * Download link.
     *
     * This points directly at the raw
     * GitHub file, so it does not depend
     * on GitHub Pages deploying first.
     */

    const download =
        document.createElement("a");

    download.className =
        "download-button";

    download.href =
        rawURL;

    download.target =
        "_blank";

    download.rel =
        "noopener";

    download.textContent =
        "Download";


    info.appendChild(name);
    info.appendChild(type);
    info.appendChild(download);


    card.appendChild(preview);
    card.appendChild(info);


    gallery.appendChild(card);

}


/*
============================================================
ESCAPE TEXT
============================================================
*/

function escapeHTML(text) {

    return String(text)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/*
============================================================
REFRESH
============================================================
*/

refreshButton.addEventListener(
    "click",
    loadGallery
);


/*
============================================================
START
============================================================
*/

loadGallery();

</script>

</body>
</html>
