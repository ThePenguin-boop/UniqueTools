<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Gallery</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #151515;
    color: #eee;
}

header {
    text-align: center;
    padding: 50px 20px 30px;
}

header h1 {
    margin: 0;
    font-size: 42px;
    font-weight: 750;
}

header p {
    margin: 10px 0 0;
    color: #999;
    font-size: 16px;
}


/* =========================
   CONTROLS
   ========================= */

.controls {
    width: min(1100px, calc(100% - 30px));

    margin: 0 auto 25px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;
}

.status {
    color: #888;
    font-size: 14px;
}

.refresh-button {
    border: 1px solid #444;
    border-radius: 8px;

    padding: 9px 14px;

    background: #222;
    color: #eee;

    font-family: inherit;
    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background 0.15s,
        border-color 0.15s;
}

.refresh-button:hover {
    background: #292929;
    border-color: #666;
}


/* =========================
   GALLERY
   ========================= */

.gallery {
    width: min(1100px, calc(100% - 30px));

    margin: 0 auto 50px;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(250px, 1fr)
        );

    gap: 20px;
}


/* =========================
   IMAGE CARD
   ========================= */

.image-card {
    overflow: hidden;

    background: #222;

    border: 1px solid #333;

    border-radius: 16px;

    transition:
        transform 0.15s,
        background 0.15s,
        border-color 0.15s;
}

.image-card:hover {
    transform: translateY(-4px);

    background: #292929;

    border-color: #555;
}


/* =========================
   IMAGE PREVIEW
   ========================= */

.image-preview {
    width: 100%;
    height: 220px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 15px;

    background-color: #888;

    background-image:
        linear-gradient(
            45deg,
            #aaa 25%,
            transparent 25%
        ),
        linear-gradient(
            -45deg,
            #aaa 25%,
            transparent 25%
        ),
        linear-gradient(
            45deg,
            transparent 75%,
            #aaa 75%
        ),
        linear-gradient(
            -45deg,
            transparent 75%,
            #aaa 75%
        );

    background-size: 30px 30px;

    background-position:
        0 0,
        0 15px,
        15px -15px,
        -15px 0;
}

.image-preview img {
    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    display: block;
}


/* =========================
   IMAGE INFO
   ========================= */

.image-info {
    padding: 16px;
}

.image-name {
    margin: 0 0 5px;

    font-size: 16px;
    font-weight: 650;

    word-break: break-word;
}

.image-type {
    margin: 0 0 14px;

    color: #888;

    font-size: 13px;
}


/* =========================
   DOWNLOAD BUTTON
   ========================= */

.download-button {
    display: block;

    width: 100%;

    padding: 10px;

    border-radius: 8px;

    background: #eee;
    color: #111;

    text-align: center;
    text-decoration: none;

    font-size: 14px;
    font-weight: 650;

    transition:
        background 0.15s;
}

.download-button:hover {
    background: #fff;
}


/* =========================
   MESSAGE
   ========================= */

.message {
    grid-column: 1 / -1;

    padding: 50px 20px;

    border-radius: 16px;

    background: #222;

    border: 1px solid #333;

    text-align: center;

    color: #888;
}

.message strong {
    display: block;

    margin-bottom: 8px;

    color: #eee;

    font-size: 18px;
}


/* =========================
   BACK BUTTON
   ========================= */

.back-button {
    display: block;

    width: fit-content;

    margin: 0 auto 50px;

    padding: 10px 15px;

    border-radius: 8px;

    background: #222;

    border: 1px solid #333;

    color: #eee;

    text-decoration: none;

    font-weight: 600;

    transition:
        background 0.15s,
        border-color 0.15s;
}

.back-button:hover {
    background: #292929;

    border-color: #555;
}


/* =========================
   FOOTER
   ========================= */

footer {
    text-align: center;

    color: #666;

    font-size: 13px;

    padding-bottom: 30px;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    header h1 {
        font-size: 34px;
    }

    .controls {
        align-items: stretch;
        flex-direction: column;
    }

    .refresh-button {
        width: 100%;
    }

    .gallery {
        grid-template-columns: 1fr;
    }

}
</style>
</head>


<body>


<header>

    <h1>📷 Image Gallery</h1>

    <p>
        Images from the UniqueTools images folder
    </p>

</header>


<div class="controls">

    <div
        class="status"
        id="status"
    >
        Finding images...
    </div>


    <button
        class="refresh-button"
        id="refreshButton"
        type="button"
    >
        ↻ Refresh
    </button>

</div>


<main
    class="gallery"
    id="gallery"
></main>


<a
    href="index.html"
    class="back-button"
>
    ← Back to My Tools
</a>


<footer>
    My personal image gallery
</footer>


<script>

/*
============================================================
AUTOMATIC GITHUB GALLERY
============================================================

Repository:

    ThePenguin-boop/UniqueTools

Images folder:

    images/

This version does NOT use:

    ❌ GitHub API
    ❌ images.json
    ❌ GitHub Actions
    ❌ API tokens

It uses jsDelivr's public GitHub file listing instead.

Simply upload an image to:

    images/

and it will automatically appear.

============================================================
*/


const OWNER =
    "ThePenguin-boop";


const REPOSITORY =
    "UniqueTools";


const BRANCH =
    "main";


const IMAGE_FOLDER =
    "images";


/*
 * jsDelivr directory API.
 *
 * This returns a list of files in the
 * GitHub repository.
 */

const DIRECTORY_URL =
    "https://data.jsdelivr.com/v1/package/gh/" +
    OWNER +
    "/" +
    REPOSITORY +
    "@" +
    BRANCH +
    "/flat";


/*
 * Base URL for the actual images.
 */

const IMAGE_BASE_URL =
    "https://cdn.jsdelivr.net/gh/" +
    OWNER +
    "/" +
    REPOSITORY +
    "@" +
    BRANCH +
    "/";


/*
============================================================
ELEMENTS
============================================================
*/

const gallery =
    document.getElementById("gallery");


const status =
    document.getElementById("status");


const refreshButton =
    document.getElementById("refreshButton");


/*
============================================================
SUPPORTED IMAGE TYPES
============================================================
*/

const supportedExtensions = [

    ".png",
    ".jpg",
    ".jpeg",
    ".gif",
    ".webp",
    ".svg",
    ".bmp",
    ".avif"

];


/*
============================================================
LOAD GALLERY
============================================================
*/

async function loadGallery() {

    gallery.innerHTML = "";

    status.textContent =
        "Finding images...";


    try {

        /*
         * Add a timestamp to reduce
         * browser caching.
         */

        const response =
            await fetch(
                DIRECTORY_URL +
                "?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Could not access the image list."
            );

        }


        const data =
            await response.json();


        /*
         * jsDelivr returns an object
         * containing the file list.
         */

        if (
            !data ||
            !Array.isArray(data.files)
        ) {

            throw new Error(
                "The image list was not formatted correctly."
            );

        }


        /*
         * Find files inside:

             images/

         */

        const imageFiles =
            data.files.filter(file => {

                const filename =
                    file.name;


                if (
                    !filename.startsWith(
                        IMAGE_FOLDER + "/"
                    )
                ) {

                    return false;

                }


                /*
                 * Don't include files inside
                 * subdirectories.
                 */

                const remaining =
                    filename.substring(
                        IMAGE_FOLDER.length + 1
                    );


                if (
                    remaining.includes("/")
                ) {

                    return false;

                }


                /*
                 * Check extension.
                 */

                const lower =
                    filename.toLowerCase();


                return supportedExtensions.some(
                    extension =>
                        lower.endsWith(extension)
                );

            });


        /*
         * Sort alphabetically.
         */

        imageFiles.sort(
            (a, b) =>
                a.name.localeCompare(
                    b.name,
                    undefined,
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                )
        );


        /*
         * No images.
         */

        if (imageFiles.length === 0) {

            status.textContent =
                "No images found.";


            gallery.innerHTML = `

                <div class="message">

                    <strong>
                        📭 No images found
                    </strong>

                    Upload an image to:

                    <br><br>

                    <b>
                        UniqueTools / images
                    </b>

                </div>

            `;

            return;

        }


        /*
         * Create cards.
         */

        imageFiles.forEach(
            createImageCard
        );


        /*
         * Show count.
         */

        status.textContent =
            imageFiles.length +
            (
                imageFiles.length === 1
                    ? " image"
                    : " images"
            ) +
            " found";


    }
    catch (error) {

        console.error(
            "Gallery error:",
            error
        );


        status.textContent =
            "Gallery error";


        gallery.innerHTML = `

            <div class="message">

                <strong>
                    ⚠️ Could not load images
                </strong>

                ${escapeHTML(error.message)}

                <br><br>

                <small>
                    Make sure the repository is public
                    and the images folder contains
                    image files.
                </small>

            </div>

        `;

    }

}


/*
============================================================
CREATE IMAGE CARD
============================================================
*/

function createImageCard(file) {

    const card =
        document.createElement("article");


    card.className =
        "image-card";


    /*
     * jsDelivr file path.

     * Example:

       images/cat.png

     */

    const imageURL =
        IMAGE_BASE_URL +
        file.name
            .split("/")
            .map(
                part =>
                    encodeURIComponent(part)
            )
            .join("/");


    /*
     * Preview area.
     */

    const preview =
        document.createElement("div");


    preview.className =
        "image-preview";


    const image =
        document.createElement("img");


    image.src =
        imageURL;


    image.alt =
        file.name
            .split("/")
            .pop();


    image.loading =
        "lazy";


    /*
     * If an image fails to load,
     * display a useful message.
     */

    image.addEventListener(
        "error",
        () => {

            image.alt =
                "Unable to load image";

        }
    );


    preview.appendChild(image);


    /*
     * Information area.
     */

    const info =
        document.createElement("div");


    info.className =
        "image-info";


    const filename =
        file.name
            .split("/")
            .pop();


    const name =
        document.createElement("p");


    name.className =
        "image-name";


    name.textContent =
        filename;


    /*
     * File type.
     */

    const extension =
        filename
            .split(".")
            .pop()
            .toUpperCase();


    const type =
        document.createElement("p");


    type.className =
        "image-type";


    type.textContent =
        extension;


    /*
     * Download link.
     */

    const download =
        document.createElement("a");


    download.className =
        "download-button";


    download.href =
        imageURL;


    download.target =
        "_blank";


    download.rel =
        "noopener";


    download.textContent =
        "Download";


    info.appendChild(name);

    info.appendChild(type);

    info.appendChild(download);


    card.appendChild(preview);

    card.appendChild(info);


    gallery.appendChild(card);

}


/*
============================================================
ESCAPE HTML
============================================================
*/

function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/*
============================================================
REFRESH
============================================================
*/

refreshButton.addEventListener(
    "click",
    loadGallery
);


/*
============================================================
START
============================================================
*/

loadGallery();

</script>

</body>
</html>
