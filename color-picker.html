<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hex Color Picker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #151515;
    color: #eee;
}

header {
    text-align: center;
    padding: 50px 20px 30px;
}

header h1 {
    margin: 0;
    font-size: 42px;
    font-weight: 750;
}

header p {
    margin: 10px 0 0;
    color: #999;
    font-size: 16px;
}

.container {
    width: min(700px, calc(100% - 30px));
    margin: 0 auto 60px;
}

.card {
    background: #222;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 30px;
}

/* Color picker */

.color-picker-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 30px;
}

#colorPicker {
    width: 180px;
    height: 180px;
    padding: 0;
    border: 0;
    border-radius: 16px;
    background: transparent;
    cursor: pointer;
}

/* HEX display */

.color-preview {
    height: 120px;
    border-radius: 12px;
    border: 1px solid #444;
    margin-bottom: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.15s;
}

.hex-display {
    background: rgba(0, 0, 0, 0.55);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
}

/* Inputs */

.value-section {
    margin-bottom: 20px;
}

.value-section label {
    display: block;
    margin-bottom: 8px;
    color: #999;
    font-size: 14px;
}

.hex-row {
    display: flex;
    gap: 10px;
}

#hexInput {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #151515;
    color: #eee;
    font-size: 16px;
    font-family: monospace;
    outline: none;
}

#hexInput:focus {
    border-color: #666;
}

button {
    padding: 12px 16px;
    border: 0;
    border-radius: 8px;
    background: #eee;
    color: #111;
    font-size: 14px;
    font-weight: 650;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
}

button:hover {
    background: #fff;
    transform: translateY(-1px);
}

button:active {
    transform: translateY(0);
}

/* RGB values */

.rgb-values {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 20px;
}

.rgb-box {
    background: #191919;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
}

.rgb-box span {
    display: block;
    color: #888;
    font-size: 13px;
    margin-bottom: 5px;
}

.rgb-box strong {
    font-size: 18px;
}

/* Copy message */

#copyMessage {
    text-align: center;
    color: #999;
    font-size: 13px;
    height: 20px;
    margin-top: 15px;
}

/* Back button */

.back-button {
    display: inline-block;
    margin-top: 25px;
    padding: 10px 15px;
    border-radius: 8px;
    background: #222;
    border: 1px solid #333;
    color: #eee;
    text-decoration: none;
    font-weight: 600;
    transition: background 0.15s, border-color 0.15s;
}

.back-button:hover {
    background: #292929;
    border-color: #555;
}

footer {
    text-align: center;
    color: #666;
    font-size: 13px;
    padding-bottom: 30px;
}

/* Mobile */

@media (max-width: 500px) {
    header h1 {
        font-size: 34px;
    }

    .card {
        padding: 20px;
    }

    #colorPicker {
        width: 150px;
        height: 150px;
    }

    .rgb-values {
        grid-template-columns: 1fr;
    }

    .hex-row {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎨 Hex Color Picker</h1>
    <p>Pick a color and get its HEX code instantly</p>
</header>

<main class="container">

    <div class="card">

        <div class="color-picker-wrapper">
            <input
                type="color"
                id="colorPicker"
                value="#5865F2"
            >
        </div>

        <div
            class="color-preview"
            id="colorPreview"
        >
            <div class="hex-display" id="hexDisplay">
                #5865F2
            </div>
        </div>

        <div class="value-section">
            <label for="hexInput">HEX Color</label>

            <div class="hex-row">
                <input
                    type="text"
                    id="hexInput"
                    value="#5865F2"
                    maxlength="7"
                    spellcheck="false"
                >

                <button id="copyButton">
                    Copy HEX
                </button>
            </div>
        </div>

        <div class="rgb-values">

            <div class="rgb-box">
                <span>Red</span>
                <strong id="redValue">88</strong>
            </div>

            <div class="rgb-box">
                <span>Green</span>
                <strong id="greenValue">101</strong>
            </div>

            <div class="rgb-box">
                <span>Blue</span>
                <strong id="blueValue">242</strong>
            </div>

        </div>

        <div id="copyMessage"></div>

    </div>

    <a href="index.html" class="back-button">
        ← Back to My Tools
    </a>

</main>

<footer>
    My personal browser tools
</footer>

<script>

const colorPicker = document.getElementById("colorPicker");
const hexInput = document.getElementById("hexInput");
const hexDisplay = document.getElementById("hexDisplay");
const colorPreview = document.getElementById("colorPreview");

const redValue = document.getElementById("redValue");
const greenValue = document.getElementById("greenValue");
const blueValue = document.getElementById("blueValue");

const copyButton = document.getElementById("copyButton");
const copyMessage = document.getElementById("copyMessage");


function updateColor(hex) {

    if (!/^#[0-9A-Fa-f]{6}$/.test(hex)) {
        return;
    }

    hex = hex.toUpperCase();

    colorPicker.value = hex;
    hexInput.value = hex;
    hexDisplay.textContent = hex;

    colorPreview.style.backgroundColor = hex;

    const r = parseInt(hex.substring(1, 3), 16);
    const g = parseInt(hex.substring(3, 5), 16);
    const b = parseInt(hex.substring(5, 7), 16);

    redValue.textContent = r;
    greenValue.textContent = g;
    blueValue.textContent = b;
}


/* Color picker changed */

colorPicker.addEventListener("input", function() {
    updateColor(this.value);
});


/* HEX input changed */

hexInput.addEventListener("input", function() {

    let value = this.value.trim();

    if (!value.startsWith("#")) {
        value = "#" + value;
    }

    if (/^#[0-9A-Fa-f]{6}$/.test(value)) {
        updateColor(value);
    }
});


/* Copy HEX */

copyButton.addEventListener("click", async function() {

    const hex = hexInput.value.toUpperCase();

    try {
        await navigator.clipboard.writeText(hex);

        copyMessage.textContent = "Copied " + hex + " ✓";

        setTimeout(function() {
            copyMessage.textContent = "";
        }, 1500);

    } catch (error) {

        hexInput.select();
        document.execCommand("copy");

        copyMessage.textContent = "Copied " + hex + " ✓";

        setTimeout(function() {
            copyMessage.textContent = "";
        }, 1500);
    }
});


/* Initial color */

updateColor("#5865F2");

</script>

</body>
</html>
